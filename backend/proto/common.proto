syntax = "proto3";

package common;



message SignInRequest {
    string email = 1;
    string password = 2;
}

message User {
    string id = 1;
    string username = 2;
    string email = 4;
    string password = 5;
    int32 roleId = 6;
    string roleName = 7;
}

message MessageResponse {
    string message = 1;
    bool success = 2;
}

message Empty {
}


message Admin{
    string id = 1;
    string username = 2;
    string email =3;
    string password = 4;
}

message Role{
    int32 id = 1;
    string roleName = 2;
}

message FilterType{
    int32 filterTypeId = 1;
    string filterName = 2;
}

message Filter{
    int32 id = 1;
    int32 filterTypeId = 2;
    string filterValue = 3;
    string filterName = 4;
}